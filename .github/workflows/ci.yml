name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  smoke:
    name: streamlit smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install streamlit pandas requests python-dotenv markdown

      - name: Smoke-test import
        run: python -c "import app; import db_utils; import ecm_utils; import llm_utils; print('Imports OK')"

      - name: Streamlit config check
        run: streamlit run app.py --server.headless true --server.port 8501 &
        timeout-minutes: 1
        run: |
          sleep 5
          curl -s http://localhost:8501 | grep -q "ECM Community" && echo "App responds OK" \
            || { echo "App did not respond"; exit 1; }
